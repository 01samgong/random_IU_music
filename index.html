    <style>
              body {
            font-family: 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            position: relative; /* 우측 상단 버튼 배치를 위한 기준점 */
        }
        
                /* 💡 추가된 스타일: 우측 상단 SNS 버튼 모음 바구니 */
        .sns-group {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column; /* 세로로 나란히 정렬 */
            gap: 8px; /* 버튼 사이의 간격 */
            align-items: flex-end; /* 오른쪽 끝 정렬 */
        }
        
        /* SNS 버튼 공통 스타일 */
        .btn-sns {
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
            width: 70px; /* 모든 버튼의 가로 길이를 통일해서 깔끔하게 마감 */
            justify-content: center;
        }
        .btn-sns:hover {
            transform: translateY(-2px);
        }

        /* 각 SNS 채널별 고유 색상 */
        .youtube { background-color: #ff0000; }
        .youtube:hover { background-color: #cc0000; }
        
        .instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .instagram:hover { opacity: 0.9; }
        
        .twitter { background-color: #000000; } /* 트위터/X 블랙 */
        .twitter:hover { background-color: #222222; }

        .card {
            background: white;
            /* 💡 padding의 네 번째 값들을 조절하여 아래쪽 여백을 늘렸습니다. */
            /* 상(35px) 우(35px) 하(65px) 좌(35px) 여백으로 요소들을 위로 올리는 효과를 줍니다. */
            padding: 35px 35px 65px 35px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            text-align: center;
            width: 320px;
            height: 520px;
        }
        .today-date { color: #888; font-size: 14px; font-weight: bold; }
        
        .album-art {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 15px;
            margin: 20px 0;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .title { color: #333; margin: 10px 0 5px 0; font-size: 26px; font-weight: bold; }
        .artist { color: #777; margin-bottom: 25px; font-size: 16px; }
        
        .btn-group {
            display: flex;
            flex-direction: column;
            align-items: center; /* 💡 버튼들이 가로로 늘어나지 않고 자기 크기를 갖도록 변경 */
            gap: 12px;
        }
        
        /* 공통 버튼 스타일 */
        .btn {
            border: none;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            transition: 0.3s;
        }
        
        /* 🎬 뮤직비디오 보기 버튼 (기본 크기 유지) */
        .btn-main {
            background-color: #a18cd1;
            color: white;
            padding: 12px 35px;
            border-radius: 25px;
            font-size: 16px;
            width: 180px; /* 터치하기 편하게 고정 너비 지정 */
        }
        .btn-main:hover {
            background-color: #fbc2eb;
            color: #333;
        }
        
        /* 💡 🎲 다른 노래 추천받기 버튼 (크기 대폭 축소) */
        .btn-refresh {
            background-color: #f3f3f3;
            color: #666;
            padding: 6px 14px;     /* 위아래 6px, 좌우 14px로 여백을 확 줄였어요 */
            border-radius: 15px;   /* 작아진 크기에 맞춰 모서리 둥글기 조정 */
            font-size: 12px;       /* 글씨 크기를 14px -> 12px로 축소 */
            font-weight: normal;   /* 글씨 두께를 가볍게 */
        }
        .btn-refresh:hover {
            background-color: #ddd;
            color: #111;
        }
    </style>
</head>

        function pickRandomSong() {
            const randomIndex = Math.floor(Math.random() * iuSongs.length);
            const selectedSong = iuSongs[randomIndex];

            document.getElementById('song-title').innerText = selectedSong.title;
            document.getElementById('album-img').src = selectedSong.img;
            document.getElementById('song-artist').innerText = selectedSong.artist;
            // 유튜브 공식 주소(url)를 직접 매칭합니다.
            document.getElementById('music-link').href = selectedSong.url;
        }

        // 초기 세팅
        const today = new Date();
        const days = ["일", "월", "화", "수", "목", "금", "토"];
        document.getElementById('current-date').innerText = `${today.getFullYear()}년 ${today.getMonth() + 1}월 ${today.getDate()}일 (${days[today.getDay()]}요일)`;
        
        pickRandomSong();
    </script>
